name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install aiohttp pytest pytest-asyncio ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m compileall -q custom_components

  home-assistant-2026-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: >-
          python -m pip install
          homeassistant==2026.9.4
          pytest-homeassistant-custom-component==0.13.367
          PyTurboJPEG==1.8.3
      - run: pytest tests_ha

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
