[project]
name = "meteocat-ha"
version = "0.1.0"
description = "Lightweight Meteocat weather and rain radar integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
